<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">AI Factory — a dev-cycle kitchen for coding agents</title>
  <desc id="desc">A chef on a catwalk supervises a factory line where work moves through five stations: plan, serve, test, review and ship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#170c09"/>
      <stop offset="1" stop-color="#2b1510"/>
    </linearGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b2a20"/>
      <stop offset="1" stop-color="#331c16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <g id="roller">
      <circle r="8" fill="#1f100c" stroke="#8a4a33" stroke-width="2"/>
      <circle r="2" fill="#8a4a33"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1060" cy="190" r="190" fill="url(#glow)"/>

  <!-- title block -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="84" fill="#ff9a3c" font-size="16" font-weight="700" letter-spacing="4">AINATIVE-BUILD / SKILLS</text>
    <text x="64" y="194" font-size="104" font-weight="800" letter-spacing="-3"><tspan fill="#ff5a1f">AI</tspan><tspan dx="28" fill="#fff4e0">Factory</tspan></text>
    <text x="72" y="248" fill="#fff4e0" fill-opacity="0.9" font-size="30" font-weight="500">A dev-cycle kitchen for coding agents</text>
    <text x="72" y="282" fill="#d1a48f" font-size="18">Claude Code · Codex · oh-my-pi · Cursor</text>
  </g>

  <!-- catwalk hung from the ceiling -->
  <g stroke="#8a4a33" stroke-width="3">
    <line x1="948" y1="0" x2="948" y2="292"/>
    <line x1="1188" y1="0" x2="1188" y2="292"/>
  </g>
  <rect x="930" y="290" width="276" height="12" rx="3" fill="#5c3022"/>
  <g stroke="#8a4a33" stroke-width="2">
    <line x1="930" y1="262" x2="1206" y2="262"/>
    <line x1="960" y1="262" x2="960" y2="290"/>
    <line x1="1000" y1="262" x2="1000" y2="290"/>
    <line x1="1136" y1="262" x2="1136" y2="290"/>
    <line x1="1176" y1="262" x2="1176" y2="290"/>
  </g>

  <!-- chef -->
  <g>
    <!-- legs -->
    <rect x="1046" y="258" width="14" height="32" rx="4" fill="#40221a"/>
    <rect x="1066" y="258" width="14" height="32" rx="4" fill="#40221a"/>
    <!-- jacket -->
    <rect x="1030" y="184" width="66" height="82" rx="20" fill="#fff4e0"/>
    <path d="M1063 190 V262" stroke="#e3d6bf" stroke-width="2"/>
    <circle cx="1054" cy="208" r="3" fill="#c9bba2"/>
    <circle cx="1072" cy="208" r="3" fill="#c9bba2"/>
    <circle cx="1054" cy="226" r="3" fill="#c9bba2"/>
    <circle cx="1072" cy="226" r="3" fill="#c9bba2"/>
    <!-- scarf -->
    <path d="M1048 184 L1078 184 L1063 200 Z" fill="#ff6b5b"/>
    <!-- arm pointing at the line, holding a ladle -->
    <path d="M1036 198 C1012 206 996 218 982 226" stroke="#fff4e0" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="980" cy="227" r="8" fill="#f2c9a0"/>
    <line x1="978" y1="228" x2="944" y2="250" stroke="#e4d6cd" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="938" cy="254" rx="11" ry="7" fill="#e4d6cd"/>
    <!-- arm with clipboard -->
    <path d="M1090 200 C1106 212 1110 226 1104 238" stroke="#fff4e0" stroke-width="14" stroke-linecap="round" fill="none"/>
    <g transform="rotate(8 1112 232)">
      <rect x="1096" y="208" width="36" height="46" rx="4" fill="#ff7a3d"/>
      <rect x="1106" y="204" width="16" height="7" rx="2" fill="#e4d6cd"/>
      <line x1="1103" y1="222" x2="1125" y2="222" stroke="#170c09" stroke-width="2.5"/>
      <line x1="1103" y1="231" x2="1125" y2="231" stroke="#170c09" stroke-width="2.5"/>
      <line x1="1103" y1="240" x2="1118" y2="240" stroke="#170c09" stroke-width="2.5"/>
    </g>
    <circle cx="1104" cy="240" r="8" fill="#f2c9a0"/>
    <!-- head -->
    <circle cx="1063" cy="160" r="25" fill="#f2c9a0"/>
    <circle cx="1054" cy="158" r="3" fill="#170c09"/>
    <circle cx="1072" cy="158" r="3" fill="#170c09"/>
    <path d="M1054 170 Q1063 177 1072 170" stroke="#170c09" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M1050 168 Q1056 166 1060 168 M1066 168 Q1070 166 1076 168" stroke="#6b4a2f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- headset: the chef calls the shots for the agents -->
    <path d="M1039 158 A24 24 0 0 1 1087 158" stroke="#ff7a3d" stroke-width="3" fill="none"/>
    <rect x="1084" y="152" width="8" height="14" rx="3" fill="#ff7a3d"/>
    <path d="M1088 166 Q1086 178 1074 178" stroke="#ff7a3d" stroke-width="2" fill="none"/>
    <!-- toque -->
    <rect x="1038" y="122" width="50" height="18" rx="3" fill="#fff4e0"/>
    <circle cx="1043" cy="116" r="17" fill="#fff4e0"/>
    <circle cx="1063" cy="104" r="23" fill="#fff4e0"/>
    <circle cx="1084" cy="116" r="17" fill="#fff4e0"/>
    <path d="M1038 132 H1088" stroke="#e3d6bf" stroke-width="2"/>
  </g>

  <!-- speech bubble -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="808" y="128" width="190" height="52" rx="14" fill="#fff4e0"/>
    <path d="M980 176 L1006 190 L990 170 Z" fill="#fff4e0"/>
    <text x="903" y="151" text-anchor="middle" fill="#170c09" font-size="15" font-weight="700">Red first.</text>
    <text x="903" y="170" text-anchor="middle" fill="#170c09" font-size="15" font-weight="700">Then make it green.</text>
  </g>

  <!-- stations -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" text-anchor="middle">
    <!-- PLAN -->
    <g transform="translate(115 340)">
      <rect width="170" height="118" rx="14" fill="url(#machine)" stroke="#7a3f2b" stroke-width="2"/>
      <rect x="14" y="12" width="118" height="26" rx="6" fill="#170c09"/>
      <text x="73" y="31" fill="#fff4e0">PLAN</text>
      <circle cx="150" cy="25" r="7" fill="#ff9a3c"/>
      <rect x="44" y="50" width="82" height="56" rx="4" fill="#d9481f"/>
      <g stroke="#ffe2d1" stroke-width="2.5" stroke-linecap="round">
        <rect x="54" y="60" width="9" height="9" rx="2" fill="none"/>
        <rect x="54" y="77" width="9" height="9" rx="2" fill="none"/>
        <rect x="54" y="94" width="9" height="9" rx="2" fill="none" stroke-opacity="0.6"/>
        <line x1="70" y1="64" x2="114" y2="64"/>
        <line x1="70" y1="81" x2="108" y2="81"/>
        <line x1="70" y1="98" x2="100" y2="98" stroke-opacity="0.6"/>
      </g>
    </g>
    <!-- SERVE -->
    <g transform="translate(335 340)">
      <g stroke="#e4d6cd" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M70 -6 C62 -18 78 -26 70 -38"/>
        <path d="M86 -4 C78 -18 94 -28 86 -44"/>
        <path d="M102 -6 C94 -18 110 -26 102 -38"/>
      </g>
      <rect width="170" height="118" rx="14" fill="url(#machine)" stroke="#7a3f2b" stroke-width="2"/>
      <rect x="14" y="12" width="118" height="26" rx="6" fill="#170c09"/>
      <text x="73" y="31" fill="#fff4e0">SERVE</text>
      <circle cx="150" cy="25" r="7" fill="#ff9a3c"/>
      <path d="M52 58 H118 V84 Q118 96 106 96 H64 Q52 96 52 84 Z" fill="#e4d6cd"/>
      <rect x="46" y="54" width="78" height="8" rx="4" fill="#f3e9e2"/>
      <rect x="38" y="64" width="14" height="6" rx="3" fill="#e4d6cd"/>
      <rect x="118" y="64" width="14" height="6" rx="3" fill="#e4d6cd"/>
      <path d="M64 108 Q70 96 76 108 Q82 94 88 108 Q94 96 100 108 Q106 98 108 108 Z" fill="#ff8a3d"/>
    </g>
    <!-- TEST -->
    <g transform="translate(555 340)">
      <rect width="170" height="118" rx="14" fill="url(#machine)" stroke="#7a3f2b" stroke-width="2"/>
      <rect x="14" y="12" width="118" height="26" rx="6" fill="#170c09"/>
      <text x="73" y="31" fill="#fff4e0">TEST</text>
      <circle cx="150" cy="25" r="7" fill="#3ddc84"/>
      <circle cx="52" cy="78" r="17" fill="#ff6b5b"/>
      <circle cx="52" cy="78" r="17" fill="none" stroke="#ff6b5b" stroke-opacity="0.35" stroke-width="8"/>
      <path d="M76 78 H96" stroke="#fff4e0" stroke-width="3" stroke-linecap="round"/>
      <path d="M90 71 L98 78 L90 85" stroke="#fff4e0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="122" cy="78" r="17" fill="#3ddc84"/>
      <circle cx="122" cy="78" r="17" fill="none" stroke="#3ddc84" stroke-opacity="0.35" stroke-width="8"/>
      <path d="M114 78 L120 84 L131 72" stroke="#170c09" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M45 71 L59 85 M59 71 L45 85" stroke="#170c09" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <!-- REVIEW -->
    <g transform="translate(775 340)">
      <rect width="170" height="118" rx="14" fill="url(#machine)" stroke="#7a3f2b" stroke-width="2"/>
      <rect x="14" y="12" width="118" height="26" rx="6" fill="#170c09"/>
      <text x="73" y="31" fill="#fff4e0">REVIEW</text>
      <circle cx="150" cy="25" r="7" fill="#3ddc84"/>
      <g stroke-linecap="round" stroke-width="4">
        <line x1="30" y1="58" x2="78" y2="58" stroke="#ff7a3d"/>
        <line x1="40" y1="72" x2="96" y2="72" stroke="#ff9a3c"/>
        <line x1="40" y1="86" x2="82" y2="86" stroke="#e4d6cd"/>
        <line x1="30" y1="100" x2="70" y2="100" stroke="#ff7a3d"/>
      </g>
      <circle cx="112" cy="78" r="20" fill="#fff4e0" fill-opacity="0.15" stroke="#fff4e0" stroke-width="5"/>
      <line x1="126" y1="93" x2="142" y2="110" stroke="#fff4e0" stroke-width="7" stroke-linecap="round"/>
    </g>
    <!-- SHIP -->
    <g transform="translate(995 340)">
      <rect width="170" height="118" rx="14" fill="url(#machine)" stroke="#7a3f2b" stroke-width="2"/>
      <rect x="14" y="12" width="118" height="26" rx="6" fill="#170c09"/>
      <text x="73" y="31" fill="#fff4e0">SHIP</text>
      <circle cx="150" cy="25" r="7" fill="#3ddc84"/>
      <path d="M52 64 L85 50 L118 64 L85 78 Z" fill="#e0a868"/>
      <path d="M52 64 V96 L85 110 V78 Z" fill="#c98d4f"/>
      <path d="M118 64 V96 L85 110 V78 Z" fill="#b07a42"/>
      <path d="M68 57 L101 71 V82" stroke="#fff4e0" stroke-opacity="0.7" stroke-width="5" fill="none"/>
    </g>
  </g>

  <!-- conveyor belt -->
  <rect x="56" y="470" width="1168" height="30" rx="15" fill="#1f100c" stroke="#8a4a33" stroke-width="2"/>
  <g stroke="#8a4a33" stroke-width="2" stroke-dasharray="14 12">
    <line x1="72" y1="470" x2="1208" y2="470"/>
  </g>
  <g>
    <use href="#roller" x="76" y="485"/>
    <use href="#roller" x="156" y="485"/>
    <use href="#roller" x="236" y="485"/>
    <use href="#roller" x="316" y="485"/>
    <use href="#roller" x="396" y="485"/>
    <use href="#roller" x="476" y="485"/>
    <use href="#roller" x="556" y="485"/>
    <use href="#roller" x="636" y="485"/>
    <use href="#roller" x="716" y="485"/>
    <use href="#roller" x="796" y="485"/>
    <use href="#roller" x="876" y="485"/>
    <use href="#roller" x="956" y="485"/>
    <use href="#roller" x="1036" y="485"/>
    <use href="#roller" x="1116" y="485"/>
    <use href="#roller" x="1196" y="485"/>
  </g>

  <!-- work moving down the line -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <!-- an idea comes in -->
    <rect x="66" y="434" width="38" height="34" rx="5" fill="#fff4e0" transform="rotate(-6 85 451)"/>
    <text x="85" y="460" fill="#170c09" font-size="22" transform="rotate(-6 85 451)">?</text>
    <!-- a phase file -->
    <rect x="294" y="440" width="32" height="28" rx="4" fill="#d9481f"/>
    <line x1="300" y1="450" x2="320" y2="450" stroke="#ffe2d1" stroke-width="2"/>
    <line x1="300" y1="458" x2="314" y2="458" stroke="#ffe2d1" stroke-width="2"/>
    <!-- a covered dish -->
    <path d="M512 466 A18 16 0 0 1 548 466 Z" fill="#e4d6cd"/>
    <circle cx="530" cy="448" r="3" fill="#e4d6cd"/>
    <rect x="506" y="465" width="48" height="4" rx="2" fill="#f3e9e2"/>
    <!-- a dish that passed its tests -->
    <path d="M732 466 A18 16 0 0 1 768 466 Z" fill="#e4d6cd"/>
    <rect x="726" y="465" width="48" height="4" rx="2" fill="#f3e9e2"/>
    <circle cx="764" cy="444" r="9" fill="#3ddc84"/>
    <path d="M759 444 L763 448 L769 440" stroke="#170c09" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- a reviewed dish -->
    <path d="M952 466 A18 16 0 0 1 988 466 Z" fill="#e4d6cd"/>
    <rect x="946" y="465" width="48" height="4" rx="2" fill="#f3e9e2"/>
    <path d="M984 434 L987 441 L994 441 L988 446 L990 453 L984 449 L978 453 L980 446 L974 441 L981 441 Z" fill="#ff9a3c"/>
    <!-- shipped -->
    <path d="M1180 448 L1198 440 L1216 448 L1198 456 Z" fill="#e0a868"/>
    <path d="M1180 448 V466 L1198 474 V456 Z" fill="#c98d4f"/>
    <path d="M1216 448 V466 L1198 474 V456 Z" fill="#b07a42"/>
  </g>

  <!-- floor caption -->
  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="640" y="574" fill="#fff4e0" font-size="22" font-weight="700">/aif-plan → /aif-serve → /aif-test → /aif-code-review → /aif-ship</text>
  </g>
</svg>
